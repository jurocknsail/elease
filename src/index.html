<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>E-Lease</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Applies the theme before the stylesheet and Angular load, to avoid a flash of the wrong theme.
      // Mirrors ThemeService (src/app/core/theme/theme.service.ts): same storage key, same fallback to
      // 'system', same colours as --color-bg in src/styles.css. ThemeService takes over once the app starts.
      (function () {
        var mode = 'system';
        try {
          var stored = localStorage.getItem('elease.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            mode = stored;
          }
        } catch (e) {
          // Storage unavailable: keep following the system.
        }
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', dark ? '#0f1115' : '#ffffff');
        }
      })();
    </script>
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <meta name="description" content="Gestion de vos locataires, baux et appels de loyer, avec révision annuelle des loyers." />
    <meta property="og:title" content="E-Lease" />
    <meta property="og:description" content="Gestion locative : locataires, baux, appels de loyer et révision des loyers." />
    <meta property="og:image" content="https://e-lease-app.smarthomeserver.online/social/og-image.png" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = dark text on the light theme ("black-translucent" is white-on-white under viewport-fit=cover).
         Dark-mode behaviour: verify on a real iPhone (plan Task 14, step 1b). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Lease" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Veuillez activer JavaScript pour utiliser E-Lease.</noscript>
  </body>
</html>
